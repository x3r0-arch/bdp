<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday sir!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Parisienne&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="decor decor-one"></div>
    <div class="decor decor-two"></div>
    <div class="decor decor-three"></div>

    <main class="page-shell">
      <section class="birthday-card">
        <div class="header-row">
          <span class="badge">Birthday Surprise</span>
          <span class="mini-heart">♥</span>
        </div>

        <div class="top-name">Happy Birthday</div>

        <div class="birthday-hero">
          <img
            class="birthday-photo"
            src="https://www.facebook.com/messenger_media?attachment_id=1655396389517048&message_id=mid.%24gAAjMzasw7nymsoCWq2ggTtARM6Tc&thread_id=2476983526157948"
            alt="Birthday photo"
          />
          <div class="birthday-name-wrap">
            <p class="birthday-label">sir naming may bitaw</p>
            <h1>sir Romeo</h1>
          </div>
        </div>

        <div class="message-box">
          <span class="quote">“</span>
          bading si zai
          <span class="quote right">”</span>
        </div>

        <div class="messenger-section">
          <h2>message namin sir</h2>
          <div id="messenger-list" class="messenger-list" aria-label="Birthday messengers"></div>
        </div>
      </section>
    </main>

    <div id="message-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="message-title">
        <button class="close-btn" aria-label="Close message">×</button>
        <div class="modal-header">
          <img id="modal-avatar" src="" alt="Messenger profile" />
          <div>
            <p class="modal-label">From</p>
            <h3 id="message-title">Messenger</h3>
          </div>
        </div>
        <p id="message-text" class="message-text"></p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
